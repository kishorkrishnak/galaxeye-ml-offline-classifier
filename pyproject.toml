[project]
name = "galaxeye-ml-offline-classifier"
version = "0.1.0"
description = "Offline satellite tile classification API take-home project"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "Pillow>=10.0,<13.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["galaxeye_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
